# /tutorial content. Plain data, read by src/commands/tutorial.ts — this
# file has no effect on behavior, only on what the /tutorial menu shows.
# Edit freely: reword, add an FAQ entry, add a new section (menu_title
# controls its button label and order; key must stay unique and
# url/callback-safe: letters, digits, underscore only).
version: 1
sections:
  - key: overview
    menu_title: "🎯 Что это и зачем"
    title: "Что это и зачем"
    body: |
      OfficeAgent — Telegram-бот на базе Claude Code, работающий на твоём
      собственном сервере.

      Пишешь текстом или голосом — он читает и редактирует файлы, выполняет
      команды в терминале, ищет информацию, помнит контекст между сессиями
      через встроенную память (gbrain: memory + recall).

      Работает по Claude-подписке или через альтернативную модель (GLM /
      Z.ai) — без отдельного API-токена за каждый запрос.

  - key: commands
    menu_title: "⚙️ Команды"
    title: "Команды"
    body: |
      <code>/help</code> — короткая справка по командам
      <code>/status</code> — снимок состояния бота и сессии
      <code>/stop</code> — попросить остановить текущую задачу
      <code>/reset force</code> — сбросить состояние сессии
      <code>/new force</code> — начать новую сессию с нуля
      <code>/model alt|primary</code> — переключить модель (можно и кнопками, без аргумента)
      <code>/tutorial</code> — это меню

  - key: usage
    menu_title: "💬 Как писать боту"
    title: "Как писать боту"
    body: |
      Пиши обычным языком, что нужно сделать. Например:
      • «покажи последние логи бота»
      • «перезапусти сервис gbrain»
      • «сколько места на диске осталось»
      • «объясни, что делает вот этот файл»
      • «напиши скрипт, который делает X»

      Голосовые сообщения тоже распознаются — если при установке был указан
      Groq-ключ. Если ключа нет, бот прямо скажет, что распознавание
      недоступно, и попросит продублировать текстом.

  - key: security
    menu_title: "🔐 Права и безопасность"
    title: "Права и безопасность"
    body: |
      Бот работает от системного пользователя без обычных прав — не root.

      Команды, требующие повышенных прав (например, перезапуск сервиса),
      сначала проверяются:
      • по-настоящему опасные операции (удаление системных данных,
        форматирование дисков и подобное) заблокированы безусловно на
        уровне кода — их не пропустит никакая кнопка;
      • рискованные, но легитимные операции (перезапуск сервиса и т.п.)
        ждут подтверждения — кнопка Allow/Deny прилетает тебе в личку, и
        ничего не выполнится без явного тапа.

  - key: faq
    menu_title: "❓ Частые вопросы"
    title: "Частые вопросы"
    body: |
      <b>Бот не отвечает</b>
      Проверь статус сервисов на сервере (<code>systemctl status
      officeagent-bot</code>) и что за модель настроена — <code>/status</code>
      покажет снимок текущего состояния.

      <b>Как добавить бота в супергруппу</b>
      Добавь бота в группу как участника, затем на сервере пропиши chat_id
      этой группы в allowlist (<code>workspaces/chats/policy.yaml</code>) и
      перезапусти бота — без этого шага сообщения из группы не доходят.

      <b>Забыл, что бот умеет</b>
      Набери <code>/tutorial</code> ещё раз — это меню всегда под рукой.
